[package]
name = "ncm-api-rs"
version = "0.1.0"
edition = "2021"
description = "Netease Cloud Music API Rust SDK"
license = "WTFPL"
repository = "https://github.com/SPlayer-Dev/ncm-api-rs"
homepage = "https://github.com/SPlayer-Dev/ncm-api-rs"

[features]
default = []
server = [
    "axum",
    "tower",
    "tower-http",
    "tracing",
    "tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/net",
]

[dependencies]
# HTTP：rustls + ring + 内置 webpki 根证书（见 request/transport.rs）
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "socks", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Async：库本身只需要运行时与同步原语，HTTP server 所需特性随 server 开启
tokio = { version = "1", features = ["rt", "sync"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# Crypto
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ecb = { version = "0.2", features = ["alloc"] }
md-5 = "0.11"
num-bigint = "0.5" # weapi / NCBL / neapi 配置用到的教科书 RSA 只需大数模幂
rand = "0.10"
hex = "0.4"
base64 = "0.22"
# Utils
thiserror = "2"
urlencoding = "2"
chrono = "0.4"
regex-lite = "0.1"
# Server (optional)
axum = { version = "0.8", features = ["multipart"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
x25519-dalek = "3"
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
flate2 = "1"
ruzstd = "0.9.0"
chacha20poly1305 = "0.11"
chacha20 = "0.10"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[[bin]]
name = "ncm-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
